
    <!DOCTYPE html>
    <html lang="ru">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Экраны DCM - Качественные метрики</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
        <style>
            body {
                background: linear-gradient(135deg, #001f3f 0%, #004080 100%);
                color: #e2e8f0;
                font-family: 'Inter', sans-serif;
                margin: 0;
            }
            .main-container {
                display: grid;
                grid-template-columns: repeat(2, 1fr);
                gap: 1.5rem;
                padding: 1.5rem;
                min-height: 100vh;
                width: 100vw;
            }
            .card {
                background-color: rgba(255, 255, 255, 0.1);
                border: 1px solid rgba(255, 255, 255, 0.2);
                border-radius: 1rem;
                padding: 2rem;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                text-align: center;
                box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
                transition: transform 0.2s;
                backdrop-filter: blur(5px);
            }
            .card:hover {
                transform: translateY(-5px);
            }
            .metric-title {
                font-size: 2.4375rem;
                font-weight: 600;
                margin-bottom: 1.25rem;
                color: #94a3b8;
                text-align: center;
            }
            .metric-value {
                font-size: clamp(5.6875rem, 9.75vw, 11.375rem);
                font-weight: 700;
                line-height: 1;
                color: #f1f5f9;
            }
            .metric-value-secondary {
                font-size: clamp(4.0625rem, 7.3125vw, 8.125rem);
                font-weight: 700;
                line-height: 1;
                color: #e2e8f0;
                margin-top: 1rem;
            }
            .metric-value-small {
                font-size: clamp(4.0625rem, 7.3125vw, 7.3125rem);
                font-weight: 700;
                line-height: 1;
            }
            .metric-dynamic {
                font-size: clamp(2.03125rem, 4.0625vw, 3.25rem);
                font-weight: 600;
                margin-top: 0.5rem;
                margin-bottom: 0.25rem;
            }
            .metric-label {
                font-size: 1.625rem;
                font-weight: 500;
                color: #64748b;
                text-transform: uppercase;
                letter-spacing: 0.05em;
                margin-top: 0.25rem;
            }
            .region-badge {
                position: fixed;
                top: 1.5rem;
                right: 1.5rem;
                background: rgba(255, 255, 255, 0.15);
                border: 2px solid rgba(255, 255, 255, 0.3);
                border-radius: 0.75rem;
                padding: 0.75rem 1.5rem;
                font-size: 1.875rem;
                font-weight: 700;
                color: #f1f5f9;
                backdrop-filter: blur(10px);
                box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
                z-index: 1000;
            }
            .metric-divider {
                width: 60%;
                height: 2px;
                background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
                margin: 1.5rem auto;
            }
            .dynamic-container {
                display: flex;
                flex-direction: column;
                align-items: center;
                margin-top: 1rem;
            }
            .arrow {
                margin-right: 0.25rem;
            }
            .text-green {
                color: #10b981;
            }
            .text-red {
                color: #ef4444;
            }
            .text-gray {
                color: #a1a1aa;
            }
            .card-criteria {
                grid-column: span 2;
            }
            .criteria-row {
                display: flex;
                justify-content: space-around;
                align-items: center;
                width: 100%;
                gap: 2rem;
                margin-top: 1.5rem;
            }
            .criteria-item {
                display: flex;
                flex-direction: column;
                align-items: center;
                flex: 1;
            }
            .criteria-label {
                font-size: 1.625rem;
                font-weight: 500;
                color: #94a3b8;
                margin-bottom: 0.75rem;
                text-align: center;
            }
            .criteria-value {
                font-size: clamp(3.25rem, 6.5vw, 6.5rem);
                font-weight: 700;
                color: #f1f5f9;
            }
            @media (min-width: 1920px) {
                .metric-title {
                    font-size: 3.25rem;
                }
                .metric-value {
                    font-size: clamp(8.125rem, 11.375vw, 16.25rem);
                }
                .metric-value-secondary {
                    font-size: clamp(5.6875rem, 8.9375vw, 11.375rem);
                }
                .metric-value-small {
                    font-size: clamp(6.5rem, 8.9375vw, 10.5625rem);
                }
                .metric-dynamic {
                    font-size: clamp(2.84375rem, 4.875vw, 4.875rem);
                }
                .metric-label {
                    font-size: 2.03125rem;
                }
                .criteria-label {
                    font-size: 2.03125rem;
                }
                .criteria-value {
                    font-size: clamp(4.875rem, 8.125vw, 9.75rem);
                }
                .card {
                    padding: 3rem;
                }
                .region-badge {
                    font-size: 3.25rem;
                    padding: 1rem 2rem;
                }
            }
            @media (min-width: 2560px) {
                .metric-title {
                    font-size: 4.875rem;
                }
                .metric-value {
                    font-size: clamp(11.375rem, 14.625vw, 22.75rem);
                }
                .metric-value-secondary {
                    font-size: clamp(8.125rem, 11.375vw, 16.25rem);
                }
                .metric-value-small {
                    font-size: clamp(8.9375rem, 11.375vw, 16.25rem);
                }
                .metric-dynamic {
                    font-size: clamp(4.0625rem, 6.5vw, 7.3125rem);
                }
                .metric-label {
                    font-size: 2.84375rem;
                }
                .criteria-label {
                    font-size: 2.84375rem;
                }
                .criteria-value {
                    font-size: clamp(7.3125rem, 9.75vw, 13rem);
                }
                .card {
                    padding: 4rem;
                }
                .region-badge {
                    font-size: 4.875rem;
                    padding: 1.25rem 2.5rem;
                }
            }
        </style>
    </head>
    <body>
        <div class="region-badge">РФ</div>
        <div class="main-container">
            
        <div class="card">
            <div class="metric-title">CAPEX, р.</div>
            <div class="metric-value">35.5 млн ₽</div>
            <div class="metric-dynamic negative">+1.9 млн ₽ (+5.8%)</div>
        </div>
        <div class="card">
            <div class="metric-title">СМР, р.</div>
            <div class="metric-value">19.9 млн ₽</div>
            <div class="metric-dynamic positive">-0.1 млн ₽ (-0.7%)</div>
        </div>
        <div class="card">
            <div class="metric-title">Средняя заполняемость ТА</div>
            <div class="metric-value">94%</div>
        </div>
        <div class="card">
            <div class="metric-title">Средняя оценка ТА</div>
            <div class="metric-value">9,8<span style="opacity: 0.5;">/10</span></div>
        </div>
        <div class="card">
            <div class="metric-title">Средняя заполняемость проектирования</div>
            <div class="metric-value">96%</div>
        </div>
        <div class="card">
            <div class="metric-title">Средняя оценка проектирования</div>
            <div class="metric-value">8,0<span style="opacity: 0.5;">/10</span></div>
        </div>
        </div>
        <script>
            setTimeout(() => {
                window.location.reload();
            }, 300000);
        </script>
    </body>
    </html>
