<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DCM Дашборды</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 600px;
            width: 100%;
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 32px;
        }
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .dashboard-list {
            list-style: none;
        }
        .dashboard-item {
            margin-bottom: 15px;
        }
        .dashboard-link {
            display: block;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-decoration: none;
            border-radius: 10px;
            transition: transform 0.2s, box-shadow 0.2s;
            font-size: 18px;
            font-weight: 500;
        }
        .dashboard-link:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }
        .update-time {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #eee;
            color: #999;
            font-size: 12px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 DCM Дашборды</h1>
        <div class="subtitle">Метрики и аналитика</div>
        
        <ul class="dashboard-list">
            <li class="dashboard-item">
                <a href="1.html" class="dashboard-link">1️⃣ Сроки открытия</a>
            </li>
            <li class="dashboard-item">
                <a href="2.html" class="dashboard-link">2️⃣ Сроки проектирования</a>
            </li>
            <li class="dashboard-item">
                <a href="3.html" class="dashboard-link">3️⃣ Количественные метрики</a>
            </li>
            <li class="dashboard-item">
                <a href="4.html" class="dashboard-link">4️⃣ Качественные метрики</a>
            </li>
            <li class="dashboard-item">
                <a href="5.html" class="dashboard-link">5️⃣ Метрики комитетов</a>
            </li>
        </ul>
        
        <div class="update-time">
            Последнее обновление: 2026-05-25 15:34
        </div>
    </div>
</body>
</html>
